# Settings for keymap-drawer, used by scripts/gen-layout.sh and the Layout CI job.
# See `keymap dump-config` for the full list of options and their defaults.
draw_config:
  # Draw combos as a separate diagram inside each layer they apply to,
  # instead of badges overlapping the keys themselves.
  separate_combo_diagrams: true
  # Light mode only: the dark variant has no background of its own, so its light
  # strokes and headers would be invisible on GitHub's light theme.
  dark_mode: false

parse_config:
  raw_binding_map:
    # `&bootloader` would otherwise be drawn verbatim; BOOT is shorter and fits.
    "&bootloader": BOOT
  # Mark every key that can be held to reach a layer, not just the first sequence
  # found: LOWER is reachable from TAB or ESC and RAISE from RET or SPACE, so
  # highlighting a single thumb key per layer misrepresents the keymap.
  mark_alternate_layer_activators: true
